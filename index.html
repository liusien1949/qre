<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Encrypted Message</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:36px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.15);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#667eea,#764ba2)}
.icon{font-size:52px;margin-bottom:14px}
h2{font-size:20px;color:#1a1a1a;margin-bottom:6px;font-weight:700}
.sub{font-size:13px;color:#999;margin-bottom:28px;line-height:1.5}
.input-wrap{position:relative;margin-bottom:16px}
.input-wrap input{width:100%;padding:14px 16px;border:2px solid #e8e8e8;border-radius:12px;font-size:16px;outline:none;transition:all .2s;background:#fafafa}
.input-wrap input:focus{border-color:#667eea;background:#fff;box-shadow:0 0 0 3px rgba(102,126,234,0.1)}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;touch-action:manipulation}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(102,126,234,0.4)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled{background:#ccc;cursor:not-allowed;transform:none;box-shadow:none}
.err{color:#e74c3c;font-size:13px;margin-top:12px;min-height:20px}
.result{margin-top:20px;padding:18px;background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border:1px solid #bbf7d0;border-radius:14px;display:none;text-align:left;position:relative}
.result.show{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.result canvas{width:100%;border-radius:8px;display:block}
.timer{font-size:13px;color:#e67e22;font-weight:600;margin-top:10px;padding:6px 14px;background:#fff8f0;border-radius:8px;display:inline-block}
.timer.urgent{color:#e74c3c;background:#fff0f0;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.dead{text-align:center}
.dead .icon{font-size:52px;margin-bottom:14px}
.dead h2{font-size:20px;color:#e74c3c;margin-bottom:8px;font-weight:700}
.dead p{font-size:13px;color:#999;line-height:1.5}
.warn{font-size:12px;color:#999;margin-top:16px;padding:8px;background:#f8f8f8;border-radius:8px;line-height:1.4}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:999;align-items:center;justify-content:center}
.overlay.show{display:flex}
.overlay-card{background:#fff;border-radius:16px;padding:32px 28px;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.overlay-card .disc-icon{font-size:40px;color:#e74c3c;margin-bottom:8px}
.overlay-card .disc-title{font-size:18px;color:#e74c3c;font-weight:800;margin-bottom:16px;letter-spacing:4px}
.overlay-card .disc-text{font-size:14px;color:#333;font-weight:500;line-height:1.8;margin-bottom:24px}
.overlay-card .disc-btns{display:flex;gap:12px;justify-content:center}
.overlay-card .disc-btns button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-ok{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-ok:hover{box-shadow:0 4px 15px rgba(102,126,234,0.4)}
.btn-no{background:#f0f0f0;color:#666}
.btn-no:hover{background:#e0e0e0}
.img-zoom{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:998;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.img-zoom.show{display:flex}
.img-zoom img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px;transition:transform .3s ease;user-select:none;-webkit-user-drag:none}
.img-zoom .page-indicator{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.8);font-size:14px;font-family:-apple-system,sans-serif;background:rgba(0,0,0,0.4);padding:6px 16px;border-radius:20px;pointer-events:none}
</style>
</head>
<body>
<div class="card">
  <div id="L">
    <div class="icon">&#128274;</div>
    <h2>加密消息</h2>
    <p class="sub">输入密码查看内容<br>仅可查看一次，阅后即焚</p>
    <div class="input-wrap">
      <input type="password" id="pwd" placeholder="请输入密码" autofocus>
    </div>
    <button class="btn" onclick="doDecrypt()">解密查看</button>
    <p class="err" id="err"></p>
    <p class="warn">注意：密码错误将立即销毁消息，切屏/截屏也会触发销毁</p>
    <p style="font-size:11px;color:#bbb;margin-top:12px">此工具仅供技术交流和娱乐，不可用于任何非法用途！</p>
  </div>
  <div id="R" class="result">
    <canvas id="canvas"></canvas>
    <div class="timer" id="tmr"></div>
  </div>
  <div id="DD" class="dead" style="display:none">
    <div class="icon">&#128274;&#128293;</div>
    <h2>已焚毁</h2>
    <p id="deadMsg">该消息已被查看、密码错误、或触发安全保护，密钥已销毁，无法再次解密。</p>
  </div>
</div>
<div id="discOverlay" class="overlay">
  <div class="overlay-card">
    <p class="disc-icon">&#9888;</p>
    <p class="disc-title">免责声明</p>
    <p class="disc-text">本工具仅限用于合法的技术研究、安全测试及学习交流目的。<br>严禁将本工具用于任何违反法律法规、侵犯他人合法权益之行为。<br>使用者应自行承担因使用本工具所产生的一切法律后果，<br>开发者不承担任何直接或间接责任。<br>点击「我知道了」即表示您已充分理解并接受上述条款。</p>
    <div class="disc-btns">
      <button class="btn-ok" onclick="discOk()">我知道了</button>
      <button class="btn-no" onclick="discNo()">不看了</button>
    </div>
  </div>
</div>
<div id="imgZoom" class="img-zoom">
  <img id="zoomImg" src="">
  <div id="pageIndicator" class="page-indicator"></div>
</div>
<script>
(function(){
var D="",N="",ET=0,VT=10,alive=1,viewing=0,viewLeft=0,viewTmr=null,plainText="",msgId="",imgRegions=[],zoomImages=[],zoomIdx=0,zoomScale=1,zoomX=0,zoomY=0,touchStartX=0,touchStartY=0,touchStartDist=0,touchMode="none",pinchStartScale=1,swipeOffset=0,isSwiping=false;

function init(){
  if(!window.crypto||!window.crypto.subtle){
    document.getElementById("L").innerHTML='<div class="icon">&#128274;</div><h2>浏览器不支持</h2><p class="sub">当前浏览器不支持解密，请点击右上角用默认浏览器打开。</p>';
    return;
  }
  var params=new URLSearchParams(location.search);
  msgId=params.get("id")||"";
  var h=location.hash.substring(1);

  if(msgId){
    // 新模式: ?id=msg_xxxx → 显示密码框，等用户点解密时再拉数据
    var hashParts=h.split("|");
    ET=hashParts.length>0?parseInt(hashParts[0],10):0;
    VT=hashParts.length>1?parseInt(hashParts[1],10):10;
    if(isNaN(VT)||VT<1)VT=10;
  }else if(h){
    // 旧模式: 从 hash 中读取加密数据
    var parts=h.split("|");
    D=parts[0];
    ET=parts.length>1?parseInt(parts[1],10):0;
    VT=parts.length>2?parseInt(parts[2],10):10;
    if(isNaN(VT)||VT<1)VT=10;
    if(!D||D.indexOf("QRE:v1:")!==0){
      document.getElementById("L").innerHTML='<div class="icon">&#128274;</div><h2>无效链接</h2><p class="sub">未找到加密数据。</p>';
      return;
    }
    N=D.substring(7,23);
    try{if(localStorage.getItem("qre_"+N)==="1"){alive=0;showDead("该消息已被查看过");}}catch(e){}
    if(alive&&ET>0&&Date.now()/1000>ET){alive=0;showDead("该消息已过期");}
  }else{
    document.getElementById("L").innerHTML='<div class="icon">&#128274;</div><h2>无效链接</h2><p class="sub">未找到加密数据。</p>';
  }
}

function fetchData(){
  var dataUrl="https://liusien1949.github.io/qre/data/"+msgId+".json";
  return fetch(dataUrl).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){
    D=j.d||"";
    if(j.e)ET=j.e;
    if(j.v)VT=j.v;
    if(!D||D.indexOf("QRE:v1:")!==0)throw new Error("无效数据");
    N=D.substring(7,23);
  });
}

function burn(){
  alive=0;
  try{localStorage.setItem("qre_"+N,"1");}catch(e){}
  D="QRE:v1:"+btoa(String.fromCharCode.apply(null,window.crypto.getRandomValues(new Uint8Array(64))));
  showDead("该消息已被销毁");
}

function showDead(msg){
  document.getElementById("L").style.display="none";
  document.getElementById("R").classList.remove("show");
  document.getElementById("R").style.display="none";
  if(msg)document.getElementById("deadMsg").textContent=msg;
  document.getElementById("DD").style.display="block";
}

function hideContent(){
  viewing=0;
  if(viewTmr)clearInterval(viewTmr);
  document.getElementById("R").classList.remove("show");
  document.getElementById("R").style.display="none";
  plainText="";
  showDead("内容已自动销毁");
}

function renderCanvas(text){
  requestAnimationFrame(function(){
  var c=document.getElementById("canvas");
  var dpr=window.devicePixelRatio||1;
  var w=Math.min(c.parentElement.clientWidth-36,380);
  if(w<100)w=340;
  var padding=16;
  var fontSize=15;
  var lineHeight=fontSize*1.6;
  imgRegions=[];

  function drawText(ctx,t,y0){
    var tmp=document.createElement("canvas");
    var tctx=tmp.getContext("2d");
    tctx.font=fontSize+"px -apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif";
    var lines=[];
    var paragraphs=t.split("\n");
    for(var p=0;p<paragraphs.length;p++){
      var words=paragraphs[p];
      if(words.length===0){lines.push("");continue;}
      var cur="";
      for(var i=0;i<words.length;i++){
        var test=cur+words[i];
        if(tctx.measureText(test).width>w-padding*2){lines.push(cur);cur=words[i];}else{cur=test;}
      }
      if(cur)lines.push(cur);
    }
    ctx.font=fontSize+"px -apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif";
    ctx.fillStyle="#1a1a1a";ctx.textBaseline="top";
    for(var i=0;i<lines.length;i++){ctx.fillText(lines[i],padding,y0+padding+i*lineHeight);}
    return lines.length*lineHeight;
  }

  var parsed=null;
  try{parsed=JSON.parse(text);}catch(e){}
  if(parsed&&parsed.images&&parsed.images.length>0){
    var imgs=parsed.images;var loaded=0;var imgEls=[];
    var txtH=0;
    zoomImages=[];
    for(var i=0;i<imgs.length;i++){zoomImages.push(imgs[i].data);}
    if(parsed.text){
      var tmp2=document.createElement("canvas");
      var tctx2=tmp2.getContext("2d");
      tctx2.font=fontSize+"px -apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif";
      var tmpLines=parsed.text.split("\n");
      txtH=tmpLines.length*lineHeight+padding*2;
    }
    for(var i=0;i<imgs.length;i++){
      (function(idx){
        var im=new Image();
        im.onload=function(){imgEls[idx]=im;loaded++;if(loaded===imgs.length)renderAll();};
        im.onerror=function(){imgEls[idx]=null;loaded++;if(loaded===imgs.length)renderAll();};
        im.src=imgs[idx].data;
      })(i);
    }
    function renderAll(){
      var total=txtH;
      var imgSizes=[];
      for(var i=0;i<imgEls.length;i++){
        if(imgEls[i]){
          var scale=Math.min((w-padding*2)/imgEls[i].width,1);
          var dw=imgEls[i].width*scale;var dh=imgEls[i].height*scale;
          imgSizes.push({el:imgEls[i],dw:dw,dh:dh});
          total+=dh+8;
        }
      }
      total+=padding;
      c.width=w*dpr;c.height=total*dpr;c.style.width=w+"px";c.style.height=total+"px";
      var ctx=c.getContext("2d");ctx.scale(dpr,dpr);
      ctx.fillStyle="#f0fdf4";ctx.beginPath();ctx.roundRect(0,0,w,total,8);ctx.fill();
      var y=0;
      if(parsed.text){drawText(ctx,parsed.text,0);y=txtH;}
      for(var i=0;i<imgSizes.length;i++){
        var ix=(w-imgSizes[i].dw)/2;
        ctx.drawImage(imgSizes[i].el,ix,y+4,imgSizes[i].dw,imgSizes[i].dh);
        imgRegions.push({x:ix,y:y+4,w:imgSizes[i].dw,h:imgSizes[i].dh,idx:i});
        y+=imgSizes[i].dh+8;
      }
      c.onclick=function(ev){
        var rect=c.getBoundingClientRect();
        var cx=(ev.clientX-rect.left);
        var cy=(ev.clientY-rect.top);
        for(var j=0;j<imgRegions.length;j++){
          var r=imgRegions[j];
          if(cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h){showZoom(r.idx);return;}
        }
      };
    }
  }else if(text.indexOf("IMG:")===0){
    var dataUrl=text.substring(4);
    zoomImages=[dataUrl];
    var img=new Image();
    img.onload=function(){
      var scale=Math.min((w-padding*2)/img.width,1);
      var dw=img.width*scale;var dh=img.height*scale;
      c.width=w*dpr;c.height=(dh+padding*2)*dpr;c.style.width=w+"px";c.style.height=(dh+padding*2)+"px";
      var ctx=c.getContext("2d");ctx.scale(dpr,dpr);
      ctx.fillStyle="#f0fdf4";ctx.beginPath();ctx.roundRect(0,0,w,dh+padding*2,8);ctx.fill();
      ctx.drawImage(img,(w-dw)/2,padding,dw,dh);
      c.onclick=function(){showZoom(0);};
    };
    img.src=dataUrl;
  }else{
    var tmp=document.createElement("canvas");
    var tctx=tmp.getContext("2d");
    tctx.font=fontSize+"px -apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif";
    var lines=[];
    var paragraphs=text.split("\n");
    for(var p=0;p<paragraphs.length;p++){
      var words=paragraphs[p];
      if(words.length===0){lines.push("");continue;}
      var cur="";
      for(var i=0;i<words.length;i++){
        var test=cur+words[i];
        if(tctx.measureText(test).width>w-padding*2){lines.push(cur);cur=words[i];}else{cur=test;}
      }
      if(cur)lines.push(cur);
    }
    var h=lines.length*lineHeight+padding*2+20;
    c.width=w*dpr;c.height=h*dpr;c.style.width=w+"px";c.style.height=h+"px";
    var ctx=c.getContext("2d");ctx.scale(dpr,dpr);
    ctx.fillStyle="#f0fdf4";ctx.beginPath();ctx.roundRect(0,0,w,h,8);ctx.fill();
    drawText(ctx,text,0);
  }
  });
}

function startTimer(){
  viewing=1;viewLeft=VT;
  var el=document.getElementById("tmr");
  el.textContent="⏱ 剩余 "+viewLeft+" 秒";
  el.className="timer";
  viewTmr=setInterval(function(){
    viewLeft--;
    if(viewLeft<=2)el.className="timer urgent";
    if(viewLeft<=0){clearInterval(viewTmr);hideContent();return;}
    el.textContent="⏱ 剩余 "+viewLeft+" 秒";
  },1000);
}

document.addEventListener("visibilitychange",function(){
  if(viewing&&document.hidden)hideContent();
});

function doActualDecrypt(){
  var pwd=document.getElementById("pwd").value;
  var err=document.getElementById("err");

  function doDecryptWithData(){
    if(!D||D.indexOf("QRE:v1:")!==0){err.textContent="加密数据无效";return;}
    try{
    var raw=atob(D.substring(7));
    var bytes=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    if(bytes.length<33){err.textContent="数据异常("+bytes.length+")";return;}
    crypto.subtle.importKey("raw",new TextEncoder().encode(pwd),{"name":"PBKDF2"},false,["deriveKey"]
    ).then(function(k){
      return crypto.subtle.deriveKey({"name":"PBKDF2","salt":bytes.slice(0,16),"iterations":100000,"hash":"SHA-256"},k,{"name":"AES-CBC","length":256},false,["decrypt"]);
    }).then(function(k){
      return crypto.subtle.decrypt({"name":"AES-CBC","iv":bytes.slice(16,32)},k,bytes.slice(32));
    }).then(function(buf){
      if(!alive)return;
      plainText=new TextDecoder().decode(buf);
      try{localStorage.setItem("qre_"+N,"1");}catch(e){}
      alive=0;
      D="QRE:v1:"+btoa(String.fromCharCode.apply(null,window.crypto.getRandomValues(new Uint8Array(64))));
      renderCanvas(plainText);
      document.getElementById("L").style.display="none";
      document.getElementById("R").style.display="block";
      document.getElementById("R").classList.add("show");
      startTimer();
    }).catch(function(e){
      if(!alive)return;
      burn();
      err.textContent="解密失败: "+(e.message||e.name||"未知错误");
    });
  }catch(e){err.textContent="解密异常: "+e.message;}
  }

  if(msgId&&!D){
    err.textContent="正在加载数据...";
    fetchData().then(function(){
      err.textContent="";
      doDecryptWithData();
    }).catch(function(e){
      err.textContent="数据正在加载，请稍后重试";
    });
  }else{
    doDecryptWithData();
  }
}

window.doDecrypt=function(){
  if(!alive){showDead("该消息已被销毁");return;}
  if(ET>0&&Date.now()/1000>ET){alive=0;showDead("该消息已过期");return;}
  var pwd=document.getElementById("pwd").value;
  var err=document.getElementById("err");
  err.textContent="";
  if(!pwd){err.textContent="请输入密码";return;}
  document.getElementById("discOverlay").classList.add("show");
};

window.discOk=function(){
  document.getElementById("discOverlay").classList.remove("show");
  doActualDecrypt();
};

window.discNo=function(){
  document.getElementById("discOverlay").classList.remove("show");
  burn();
};

window.closeZoom=function(){
  document.getElementById("imgZoom").classList.remove("show");
  zoomScale=1;zoomX=0;zoomY=0;
};

window.showZoom=function(idx){
  zoomIdx=idx;zoomScale=1;zoomX=0;zoomY=0;
  var img=document.getElementById("zoomImg");
  img.src=zoomImages[idx];
  img.style.transform="";
  updatePageIndicator();
  document.getElementById("imgZoom").classList.add("show");
};

function updatePageIndicator(){
  var el=document.getElementById("pageIndicator");
  if(zoomImages.length>1){el.textContent=(zoomIdx+1)+" / "+zoomImages.length;el.style.display="block";}
  else{el.style.display="none";}
}

function applyTransform(){
  var img=document.getElementById("zoomImg");
  img.style.transition="none";
  img.style.transform="translate("+zoomX+"px,"+zoomY+"px) scale("+zoomScale+")";
}

function applyTransformAnimated(){
  var img=document.getElementById("zoomImg");
  img.style.transition="transform .3s ease";
  img.style.transform="translate("+zoomX+"px,"+zoomY+"px) scale("+zoomScale+")";
}

(function(){
  var overlay=document.getElementById("imgZoom");
  var img=document.getElementById("zoomImg");

  // PC: wheel zoom
  overlay.addEventListener("wheel",function(e){
    e.preventDefault();
    var delta=e.deltaY>0?-0.15:0.15;
    zoomScale=Math.min(5,Math.max(1,zoomScale+delta));
    if(zoomScale===1){zoomX=0;zoomY=0;}
    applyTransform();
  });

  // PC: click to close (only if no drag)
  var mouseDownX=0,mouseDownY=0,mouseMoved=false;
  overlay.addEventListener("mousedown",function(e){mouseDownX=e.clientX;mouseDownY=e.clientY;mouseMoved=false;});
  overlay.addEventListener("mousemove",function(e){
    if(Math.abs(e.clientX-mouseDownX)>5||Math.abs(e.clientY-mouseDownY)>5)mouseMoved=true;
  });
  overlay.addEventListener("mouseup",function(e){
    if(!mouseMoved&&zoomScale===1)closeZoom();
  });

  // Mobile: touch events
  overlay.addEventListener("touchstart",function(e){
    if(e.touches.length===1){
      touchMode="single";
      touchStartX=e.touches[0].clientX;
      touchStartY=e.touches[0].clientY;
      swipeOffset=0;isSwiping=false;
    }else if(e.touches.length===2){
      touchMode="pinch";
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      touchStartDist=Math.sqrt(dx*dx+dy*dy);
      pinchStartScale=zoomScale;
    }
  },{passive:false});

  overlay.addEventListener("touchmove",function(e){
    e.preventDefault();
    if(touchMode==="single"&&zoomScale===1){
      swipeOffset=e.touches[0].clientX-touchStartX;
      img.style.transition="none";
      img.style.transform="translate("+swipeOffset+"px,0)";
      if(Math.abs(swipeOffset)>10)isSwiping=true;
    }else if(touchMode==="single"&&zoomScale>1){
      var dx=e.touches[0].clientX-touchStartX;
      var dy=e.touches[0].clientY-touchStartY;
      touchStartX=e.touches[0].clientX;
      touchStartY=e.touches[0].clientY;
      zoomX+=dx;zoomY+=dy;
      applyTransform();
    }else if(touchMode==="pinch"&&e.touches.length===2){
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      var dist=Math.sqrt(dx*dx+dy*dy);
      zoomScale=Math.min(5,Math.max(1,pinchStartScale*(dist/touchStartDist)));
      applyTransform();
    }
  },{passive:false});

  overlay.addEventListener("touchend",function(e){
    if(touchMode==="single"&&zoomScale===1){
      if(Math.abs(swipeOffset)>50){
        var newIdx=swipeOffset<0?zoomIdx+1:zoomIdx-1;
        if(newIdx>=0&&newIdx<zoomImages.length){
          zoomIdx=newIdx;
          img.src=zoomImages[zoomIdx];
          updatePageIndicator();
        }
      }
      zoomX=0;zoomY=0;
      applyTransformAnimated();
      if(!isSwiping&&Math.abs(swipeOffset)<10){
        closeZoom();
      }
    }else if(touchMode==="pinch"){
      if(e.touches.length<2){
        touchMode="single";
        if(zoomScale<1.1){zoomScale=1;zoomX=0;zoomY=0;applyTransformAnimated();}
      }
    }
    swipeOffset=0;isSwiping=false;
  },{passive:false});
})();

document.getElementById("pwd").addEventListener("keydown",function(e){if(e.key==="Enter")doDecrypt();});
document.addEventListener("contextmenu",function(e){e.preventDefault();});
document.addEventListener("keydown",function(e){
  if(e.key==="F12"||e.key==="PrintScreen"||
    (e.ctrlKey&&e.shiftKey&&(e.key==="I"||e.key==="J"||e.key==="C"||e.key==="S"))||
    (e.ctrlKey&&e.key==="u")||(e.altKey&&e.key==="Tab")){
    e.preventDefault();
  }
});

init();
})();
</script>
